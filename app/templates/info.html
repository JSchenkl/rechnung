{% extends 'base.html' %}
{% block title %}Info{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Info</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-5">Anwendung</dt>
          <dd class="col-7">Rechnungs-App</dd>

          <dt class="col-5">Betreiber</dt>
          <dd class="col-7">Julius Schenkl</dd>

          <dt class="col-5">Commit</dt>
          <dd class="col-7">
            <a href="https://github.com/JSchenkl/rechnung/commit/{{ commit }}"
               target="_blank" class="font-monospace">{{ commit }}</a>
          </dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}
