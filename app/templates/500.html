{% extends 'base.html' %}
{% block title %}Fehler{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
        <h2 class="mt-3">Es ist ein Fehler aufgetreten</h2>
        <p class="text-muted">
          Beim Verarbeiten der Anfrage ist etwas schiefgelaufen. Der Fehler wurde protokolliert.
        </p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Zum Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
