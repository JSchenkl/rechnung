{% extends 'base.html' %}
{% block title %}{{ 'Kunde bearbeiten' if customer else 'Neuer Kunde' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h2 class="mb-4">{{ 'Kunde bearbeiten' if customer else 'Neuer Kunde' }}</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label">Name *</label>
            <input type="text" name="name" class="form-control"
                   value="{{ customer.name if customer else '' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Firma <span class="text-muted">(optional)</span></label>
            <input type="text" name="company" class="form-control"
                   value="{{ customer.company or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Straße und Hausnummer *</label>
            <input type="text" name="street" class="form-control"
                   value="{{ customer.street if customer else '' }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-4">
              <label class="form-label">PLZ *</label>
              <input type="text" name="postal_code" class="form-control"
                     value="{{ customer.postal_code if customer else '' }}" required maxlength="10">
            </div>
            <div class="col-8">
              <label class="form-label">Ort *</label>
              <input type="text" name="city" class="form-control"
                     value="{{ customer.city if customer else '' }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">E-Mail *</label>
            <input type="email" name="email" class="form-control"
                   value="{{ customer.email if customer else '' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Telefon <span class="text-muted">(optional)</span></label>
            <input type="text" name="phone" class="form-control"
                   value="{{ customer.phone or '' }}">
          </div>

          <div class="mb-4">
            <label class="form-label">Notizen <span class="text-muted">(optional)</span></label>
            <textarea name="notes" class="form-control" rows="2">{{ customer.notes or '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a href="{{ url_for('customers.list') }}" class="btn btn-outline-secondary">Abbrechen</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
