services:
  julius-app:
    build: .
    container_name: julius-app
    restart: unless-stopped
    env_file: ./.env
    environment:
      FLASK_ENV: production
      LOG_FILE: /app/logs/app.log
    volumes:
      - julius-data:/app/dbdata
      - julius-logs:/app/logs
    expose:
      - "5000"
    networks:
      - proxy

volumes:
  julius-data:
  julius-logs:

networks:
  proxy:
    name: proxy
    external: true
